plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maqz.videoplayer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.maqz.videoplayer'
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'org.videolan.android:libvlc-all:3.6.2'
}
